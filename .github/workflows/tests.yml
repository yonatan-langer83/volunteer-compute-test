name: tests

on:
  pull_request:
  push:
    branches: [main]
  # volunteer-apply.yml starts this by hand, because a pull request opened
  # with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and pytest
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest
